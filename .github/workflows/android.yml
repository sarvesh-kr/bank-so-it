name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore private signing key if configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p signing
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks
            printf '%s' "$KEYSTORE_PASSWORD" > signing/password.txt
            chmod 600 signing/*
          else
            echo 'No persistent signing key configured; this build will use a temporary key and cannot upgrade existing installations.'
          fi
      - run: bash tools/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RRB-IT-Practice-Lite-APK
          path: dist/RRB-IT-Practice-Lite.apk
