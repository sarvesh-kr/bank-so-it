name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      deploy-with-actions: ${{ steps.pages.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 tools/build_bank.py
      - run: npm test
      - run: npm run build:web
      - run: python3 tools/build_web.py --check-root
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - name: Check Pages publishing source
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getPages(context.repo);
              core.info(`Pages source: ${data.build_type}`);
              return data.build_type === 'workflow';
            } catch (error) {
              if (![403, 404].includes(error.status)) throw error;
              core.notice('Pages source is not accessible. For branch hosting, select main / (root) in Settings > Pages.');
              return false;
            }
  deploy:
    if: github.event_name != 'pull_request' && needs.test-and-build.outputs.deploy-with-actions == 'true'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
